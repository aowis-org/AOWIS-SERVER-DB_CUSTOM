# Reverse proxy for aowis-server-db built with Qt < 6.11 (e.g. Debian 13),
# which cannot limit HTTP request sizes itself. nginx enforces the limits;
# aowis-server-db listens on loopback only.
#
# aowis-server-db.ini:
#   [server]
#   bind=127.0.0.1
#   port=8755
#   proxy_enforces_body_limit=true
#
# Keep client_max_body_size equal to [sync] max_transfer_mib (bundle uploads
# are the largest requests; JSON bodies are at most 8 MiB). Add TLS and access
# control here; aowis-server-db has neither yet.

server {
    listen 8443 ssl;
    server_name aowis-db.example.org;

    # ssl_certificate     /etc/ssl/aowis-db/fullchain.pem;
    # ssl_certificate_key /etc/ssl/aowis-db/privkey.pem;

    client_max_body_size 32m;          # = [sync] max_transfer_mib
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k; # bounds request line and headers
    client_body_timeout 60s;
    proxy_request_buffering on;        # complete, size-checked bodies only

    location /api/ {
        proxy_pass http://127.0.0.1:8755;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;       # large bundle exports
    }
}

# Optional TLS-terminating reverse proxy for aowis-server-dvmdb, which speaks
# plain HTTP and has no access control yet. aowis-server-dvmdb enforces its own
# request limits; the nginx limits below are a second line of defence.
#
# aowis-server-dvmdb.ini:
#   [server]
#   bind=127.0.0.1
#   port=8755
#
# Keep client_max_body_size equal to [sync] max_transfer_mib (bundle uploads
# are the largest requests; JSON bodies are at most 8 MiB).

server {
    listen 8443 ssl;
    server_name aowis-dvmdb.example.org;

    # ssl_certificate     /etc/ssl/aowis-dvmdb/fullchain.pem;
    # ssl_certificate_key /etc/ssl/aowis-dvmdb/privkey.pem;

    client_max_body_size 32m;          # = [sync] max_transfer_mib
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k; # bounds request line and headers
    client_body_timeout 60s;
    proxy_request_buffering off;       # aowis-server-dvmdb streams uploads itself

    location /api/ {
        proxy_pass http://127.0.0.1:8755;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;       # large bundle exports
    }
}

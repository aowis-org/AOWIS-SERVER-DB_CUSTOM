[server]
bind=127.0.0.1
port=8755
# HTTP worker threads (1..256). Request limits are enforced by the server
# itself; see docs/native-database-service.md.
worker_threads=8
# Operations of ONE project that may wait or run at the same time
# (1..worker_threads, default half the workers). Further requests for that
# project get 503 with Retry-After; other projects are not affected.
max_pending_per_project=4

[storage]
root=/var/lib/aowis-db

# Binary replication transfers use the portable .aowbundle format.
# Each request is bounded; larger snapshots currently require the native CLI.
[sync]
max_transfer_mib=32
max_objects=100000
max_object_mib=8

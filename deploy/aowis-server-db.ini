[server]
bind=127.0.0.1
port=8755
# Qt < 6.11 cannot limit HTTP request sizes. Set to true only when a reverse
# proxy enforces them (see nginx-aowis-server-db.conf); otherwise the server
# refuses non-loopback bind addresses. Ignored with Qt >= 6.11.
proxy_enforces_body_limit=false

[storage]
root=/var/lib/aowis-db

# Binary replication transfers use the portable .aowbundle format.
# Each request is bounded; larger snapshots currently require the native CLI.
[sync]
max_transfer_mib=32
max_objects=100000
max_object_mib=8

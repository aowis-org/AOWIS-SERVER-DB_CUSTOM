openapi: 3.1.0
info:
  title: AOWIS Native Database Service API
  version: 1.0.0
  description: Project/catalogue, revision, hydraulic persistence, entity edits, diffs, semantic merging and bounded binary full/incremental bundle synchronization.
servers:
  - url: http://127.0.0.1:8755/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Server process is responding}
  /ready:
    get:
      operationId: readiness
      responses:
        '200': {description: Catalogue is available}
        '503': {description: Catalogue unavailable}
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: Published projects ordered by UUID
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: {$ref: '#/components/schemas/Project'}
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, minLength: 1, maxLength: 200}
                storage: {type: string, enum: [pack]}
      responses:
        '201':
          description: Project and initial main branch published
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /projects/{projectId}/branches/{branch}/bundle:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    get:
      operationId: exportBranchBundle
      description: |
        Export the full portable immutable revision graph or an incremental
        delta relative to a base ancestor. The binary result is capped by
        configured transfer size, object-count and individual-object limits.
        The response is streamed in chunks from a nameless scratch file in the project repository, which is released when the response ends.
      parameters:
        - name: base
          in: query
          required: false
          schema: {$ref: '#/components/schemas/RevisionHash'}
      responses:
        '200':
          description: Full or incremental portable AOWIS bundle
          content:
            application/vnd.aowis.bundle:
              schema: {type: string, format: binary}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Export exceeds configured transfer limit}
    post:
      operationId: importBranchBundle
      description: |
        Validate a complete binary bundle and create or fast-forward the
        destination branch atomically. Repeated imports return up_to_date.
        Divergent history is never overwritten. The body is streamed into a
        project scratch file; a declared or received size above the transfer
        limit returns 413 before (or while) reading it.
      requestBody:
        required: true
        content:
          application/vnd.aowis.bundle:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: Existing branch fast-forwarded or already up-to-date
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BundleImportResult'}
        '201':
          description: Destination branch created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BundleImportResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {description: Upload exceeds configured transfer limit}
  /projects/{projectId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: getProject
      responses:
        '200':
          description: Project metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    get:
      operationId: listBranches
      responses:
        '200':
          description: Branch names
          content:
            application/json:
              schema:
                type: object
                required: [branches]
                properties:
                  branches:
                    type: array
                    items: {type: string}
    post:
      operationId: createBranch
      description: Creates an empty branch, forks the current head of fromBranch, or forks a specified reachable immutable revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, pattern: '^[a-zA-Z0-9_-]{1,96}$'}
                fromBranch: {type: string, pattern: '^[a-zA-Z0-9_-]{1,96}$'}
                revision: {$ref: '#/components/schemas/RevisionHash'}
      responses:
        '201':
          description: New branch head
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches/{branch}/head:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    get:
      operationId: getBranchHead
      responses:
        '200':
          description: Current branch revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/history:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 1000, default: 100}
      - name: after
        in: query
        schema: {$ref: '#/components/schemas/RevisionHash'}
    get:
      operationId: getHistory
      description: First-parent chain, newest first. Cursor exclusive and must belong to this branch's first-parent chain.
      responses:
        '200':
          description: Revision page
          content:
            application/json:
              schema:
                type: object
                required: [revisions]
                properties:
                  revisions:
                    type: array
                    items: {$ref: '#/components/schemas/Revision'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /projects/{projectId}/revisions/{revisionHash}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - name: revisionHash
        in: path
        required: true
        schema: {$ref: '#/components/schemas/RevisionHash'}
    get:
      operationId: getRevision
      responses:
        '200':
          description: Immutable revision metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/diff:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {name: from, in: query, required: true, schema: {$ref: '#/components/schemas/RevisionHash'}}
      - {name: to, in: query, required: true, schema: {$ref: '#/components/schemas/RevisionHash'}}
    get:
      operationId: diffImmutableRevisions
      description: Compare two immutable revision roots. At most 1000 changed records; larger differences return 413 limit_exceeded, detected without materializing the full difference. No pagination.
      responses:
        '200':
          description: Changed UUIDs and before/after value hashes
          content:
            application/json:
              schema:
                type: object
                required: [from, to, changes]
                properties:
                  from: {$ref: '#/components/schemas/RevisionHash'}
                  to: {$ref: '#/components/schemas/RevisionHash'}
                  changes:
                    type: array
                    items:
                      type: object
                      required: [uuid, before, after]
                      properties:
                        uuid: {type: string, format: uuid}
                        before: {oneOf: [{$ref: '#/components/schemas/RevisionHash'}, {type: 'null'}]}
                        after: {oneOf: [{$ref: '#/components/schemas/RevisionHash'}, {type: 'null'}]}
        '400': {$ref: '#/components/responses/BadRequest'}
  /projects/{projectId}/branches/{branch}/networks:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
    post:
      operationId: saveHydraulicNetwork
      description: Atomically create or replace a complete validated network. Requires the exact expected branch head; no implicit retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHead, payloadBase64]
              properties:
                expectedHead: {$ref: '#/components/schemas/RevisionHash'}
                payloadBase64: {type: string, contentEncoding: base64, description: Canonical ModelCodec<NetworkHydraulic> bytes}
      responses:
        '201':
          description: Published revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {$ref: '#/components/parameters/OptionalRevision'}
    get:
      operationId: getHydraulicNetwork
      responses:
        '200':
          description: Snapshot-pinned complete hydraulic network
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CanonicalPayload'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/entities:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {$ref: '#/components/parameters/OptionalRevision'}
      - {name: type, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 17}}
    get:
      operationId: listHydraulicEntities
      description: Ordered UUIDs for one network collection; at most 10000 UUIDs, larger collections return 413 limit_exceeded.
      responses:
        '200':
          description: Entity UUIDs and pinned revision
          content:
            application/json:
              schema:
                type: object
                required: [revision, type, uuids]
                properties:
                  revision: {$ref: '#/components/schemas/RevisionHash'}
                  type: {type: integer, minimum: 0, maximum: 17}
                  uuids: {type: array, items: {type: string, format: uuid}}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/entities/{entityId}:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
      - {$ref: '#/components/parameters/OptionalRevision'}
      - {name: entityId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getHydraulicEntity
      responses:
        '200':
          description: Canonical entity payload and enum ordinal type
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CanonicalPayload'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{projectId}/branches/{branch}/networks/{networkId}/edits:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
      - {$ref: '#/components/parameters/Branch'}
      - {$ref: '#/components/parameters/NetworkId'}
    post:
      operationId: editHydraulicNetwork
      description: One atomic batch of at most 128 changes validated by native hydraulic persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedHead, changes]
              properties:
                expectedHead: {$ref: '#/components/schemas/RevisionHash'}
                changes:
                  type: array
                  maxItems: 128
                  items:
                    oneOf:
                      - {type: object, additionalProperties: false, required: [uuid, delete], properties: {uuid: {type: string, format: uuid}, delete: {const: true}}}
                      - {type: object, additionalProperties: false, required: [uuid, type, payloadBase64], properties: {uuid: {type: string, format: uuid}, type: {type: integer, minimum: 0, maximum: 17}, payloadBase64: {type: string, contentEncoding: base64}}}
      responses:
        '200':
          description: New revision and edit diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [revision, diagnostics]
                properties:
                  revision: {$ref: '#/components/schemas/Revision'}
                  diagnostics: {type: object}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{projectId}/merges:
    parameters:
      - {$ref: '#/components/parameters/ProjectId'}
    post:
      operationId: mergeHydraulicBranches
      description: Validated hydraulic three-way merge. Conflicts return 409 and do not publish; explicit field/object choices must be pinned to the exact branch tips.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, source, expectedTargetHead, expectedSourceHead]
              properties:
                target: {type: string}
                source: {type: string}
                expectedTargetHead: {$ref: '#/components/schemas/RevisionHash'}
                expectedSourceHead: {$ref: '#/components/schemas/RevisionHash'}
                fieldChoices:
                  type: array
                  items: {type: object, required: [entityUuid, field, side], properties: {entityUuid: {type: string, format: uuid}, field: {type: string}, side: {type: string, enum: [target, source]}}}
                objectChoices:
                  type: array
                  items: {type: object, required: [entityUuid, side], properties: {entityUuid: {type: string, format: uuid}, side: {type: string, enum: [target, source]}}}
      responses:
        '200': {description: Up-to-date, fast-forward or merged revision with conflict list}
        '409': {description: Unpublished conflicts or changed expected heads}
components:
  schemas:
    CanonicalPayload:
      type: object
      required: [revision, uuid, payloadBase64]
      properties:
        revision: {$ref: '#/components/schemas/RevisionHash'}
        uuid: {type: string, format: uuid}
        type: {type: integer, minimum: 0, maximum: 17}
        payloadBase64: {type: string, contentEncoding: base64}
    BundleImportResult:
      type: object
      required: [status, head, objectsImported]
      properties:
        status: {type: string, enum: [created, fast_forward, up_to_date]}
        head: {$ref: '#/components/schemas/RevisionHash'}
        objectsImported: {type: integer, minimum: 0}
    RevisionHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    Project:
      type: object
      required: [id, name, storage]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        storage: {type: string, enum: [pack]}
    Revision:
      type: object
      required: [id, root, referencesRoot, modelIndexed, parents]
      properties:
        id: {$ref: '#/components/schemas/RevisionHash'}
        root: {$ref: '#/components/schemas/RevisionHash'}
        referencesRoot: {$ref: '#/components/schemas/RevisionHash'}
        modelIndexed: {type: boolean}
        parents:
          type: array
          items: {$ref: '#/components/schemas/RevisionHash'}
    Error:
      type: object
      description: >-
        Every error is classified by the engine's StorageErrorKind, never by
        message text. Global mapping: invalid_request 400, not_found 404,
        conflict 409, limit_exceeded 413, unavailable 503,
        insufficient_storage 507, internal_error 500. 5xx responses carry a
        generic message only; details (corruption, I/O, paths) are written to
        the service log. Bundle routes use transfer-specific codes
        (invalid_bundle 400, divergent_history / invalid_base 409,
        transfer_too_large 413). JSON requests without Content-Length return 411 length_required; oversized URIs 414 uri_too_long. Hashes of existing objects that are not
        revisions are reported as not_found.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
  parameters:
    NetworkId:
      name: networkId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OptionalRevision:
      name: revision
      in: query
      required: false
      description: Explicit immutable revision snapshot; must be the branch head or one of its ancestors (otherwise 404). Defaults to the branch head captured once
      schema: {$ref: '#/components/schemas/RevisionHash'}
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Branch:
      name: branch
      in: path
      required: true
      schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,96}$'}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: A resource already exists or revision conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ServerError:
      description: Storage corruption, I/O or internal failure (generic message; details in the service log)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Repository handle must be reopened (for example after an interrupted compaction)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InsufficientStorage:
      description: The server's storage is exhausted (ENOSPC/EDQUOT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
